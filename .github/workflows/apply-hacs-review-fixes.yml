name: Apply HACS review fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'jacumal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python scripts/apply_hacs_review_fixes.py
      - name: Commit integration changes
        run: |
          git config user.name "jacumal"
          git config user.email "82122168+jacumal@users.noreply.github.com"
          git add custom_components/aemet_alertas CHANGELOG.md
          git commit -m "Fix HACS review feedback and bundle card [skip ci]"
          git push
